<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de Repas Végétarien</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Calculateur d'Équilibre Protéique</h1>
  <p class="subtitle">Ingrédients pesés <strong>CRUS</strong> • Protéines, Valeur Biologique, B12 et Calories</p>

  <form id="meal-form">
    <div class="grid-select">
      <!-- Céréales crus -->
      <div class="select-group">
        <label for="cereale">Céréales (poids CRU) :</label>
        <select id="cereale">
          <option value="">-- Aucun --</option>
          <option value="riz" data-prot="7.0" data-b12="0" data-cal="360">Riz cru (360 kcal / 7g prot / 100g)</option>
          <option value="quinoa" data-prot="14.0" data-b12="0" data-cal="368" data-complete="true">Quinoa cru (368 kcal / 14g prot / 100g) ★</option>
          <option value="pates" data-prot="12.5" data-b12="0" data-cal="350">Pâtes crues (350 kcal / 12.5g prot / 100g)</option>
          <option value="avoine" data-prot="13.5" data-b12="0" data-cal="389">Flocons d'avoine (389 kcal / 13.5g prot / 100g)</option>
          <option value="sarrasin" data-prot="13.0" data-b12="0" data-cal="343" data-complete="true">Sarrasin cru (343 kcal / 13g prot / 100g) ★</option>
        </select>
        <div class="portion-inputs">
          <input type="number" id="qty-cereale" value="60" min="0" placeholder="Grammes">
          <span>g cru</span>
        </div>
      </div>

      <!-- Légumineuses & Soja -->
      <div class="select-group">
        <label for="legumineuse">Légumineuses / Soja (poids CRU) :</label>
        <select id="legumineuse">
          <option value="">-- Aucun --</option>
          <option value="lentilles" data-prot="25.0" data-b12="0" data-cal="350">Lentilles sèches (350 kcal / 25g prot / 100g)</option>
          <option value="pois_chiches" data-prot="19.0" data-b12="0" data-cal="364">Pois chiches secs (364 kcal / 19g prot / 100g)</option>
          <option value="tofu" data-prot="12.0" data-b12="0" data-cal="144" data-complete="true">Tofu frais (144 kcal / 12g prot / 100g) ★</option>
          <option value="tempeh" data-prot="19.0" data-b12="0" data-cal="193" data-complete="true">Tempeh (193 kcal / 19g prot / 100g) ★</option>
        </select>
        <div class="portion-inputs">
          <input type="number" id="qty-legumineuse" value="50" min="0" placeholder="Grammes">
          <span>g</span>
        </div>
      </div>
    </div>

    <div class="grid-select">
      <!-- Produits laitiers & Œufs -->
      <div class="select-group">
        <label for="laitier">Produits Laitiers / Œufs / Laits :</label>
        <select id="laitier">
          <option value="">-- Aucun --</option>
          <option value="skyr" data-prot="10.0" data-b12="0.3" data-cal="57" data-complete="true">Skyr / Fromage blanc 0% (57 kcal / 10g prot / 100g) ★</option>
          <option value="yaourt_grec" data-prot="6.0" data-b12="0.3" data-cal="120" data-complete="true">Yaourt grec (120 kcal / 6g prot / 100g) ★</option>
          <option value="oeuf" data-prot="13.0" data-b12="1.1" data-cal="155" data-complete="true">Œuf entier (155 kcal / 13g prot / 100g) ★</option>
          <option value="lait_vache" data-prot="3.3" data-b12="0.4" data-cal="62" data-complete="true">Lait de vache (62 kcal / 3.3g prot / 100ml) ★</option>
          <option value="lait_veg_b12" data-prot="3.0" data-b12="0.38" data-cal="45">Lait végétal enrichi (45 kcal / 3g prot / 100ml)</option>
          <option value="fromage" data-prot="22.0" data-b12="1.5" data-cal="350" data-complete="true">Fromage pâte dure (350 kcal / 22g prot / 100g) ★</option>
        </select>
        <div class="portion-inputs">
          <input type="number" id="qty-laitier" value="100" min="0" placeholder="Grammes ou ml">
          <span>g/ml</span>
        </div>
      </div>

      <!-- Légumes -->
      <div class="select-group">
        <label for="legume">Légumes frais :</label>
        <select id="legume">
          <option value="">-- Aucun --</option>
          <option value="brocoli" data-prot="2.8" data-b12="0" data-cal="34">Brocoli (34 kcal / 2.8g prot / 100g)</option>
          <option value="epinard" data-prot="2.9" data-b12="0" data-cal="23">Épinards (23 kcal / 2.9g prot / 100g)</option>
          <option value="petits_pois" data-prot="5.4" data-b12="0" data-cal="81">Petits pois (81 kcal / 5.4g prot / 100g)</option>
          <option value="legumes_mix" data-prot="1.5" data-b12="0" data-cal="30">Légumes variés (30 kcal / 1.5g prot / 100g)</option>
        </select>
        <div class="portion-inputs">
          <input type="number" id="qty-legume" value="150" min="0" placeholder="Grammes">
          <span>g</span>
        </div>
      </div>
    </div>

    <!-- Complément B12 -->
    <div class="select-group" style="margin-bottom: 15px;">
      <label for="b12-source" style="color: #ed6c02;">Complément B12 / Levure :</label>
      <select id="b12-source">
        <option value="">-- Aucun --</option>
        <option value="levure_b12" data-prot="45" data-b12="44" data-cal="325">Levure maltée B12 (325 kcal / 45g prot / 44µg B12 / 100g)</option>
      </select>
      <div class="portion-inputs" style="max-width: 300px;">
        <input type="number" id="qty-b12" value="5" min="0" placeholder="Grammes">
        <span>g</span>
      </div>
    </div>

    <button type="button" id="btn-submit">Calculer l'équilibre du repas</button>
  </form>

  <!-- Résultat (Mise en page originale) -->
  <div id="result" class="result-card">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-value" id="total-protein">0</span>
        <span class="stat-unit">g Protéines Totales</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="quality-score">0%</span>
        <span class="stat-unit">Valeur Biologique (vs Viande)</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="total-b12">0</span>
        <span class="stat-unit">µg Vitamine B12</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="total-calories">0</span>
        <span class="stat-unit">kcal (Énergie totale)</span>
      </div>
    </div>

    <p id="portion-advice-text" class="status-msg"></p>
    <p id="b12-status-text" class="status-msg"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
