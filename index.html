<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur d'Assiette Équilibrée</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Générateur d'Assiette Équilibrée</h1>
  <p class="subtitle">Sélectionnez vos ingrédients : l'application ajuste automatiquement les portions (Équivalent Viande)</p>

  <form id="meal-form">
    <div class="grid-select">
      <!-- Céréales -->
      <div class="select-group">
        <label for="cereale">Céréales (poids CRU) :</label>
        <select id="cereale">
          <option value="">-- Aucune --</option>
          <option value="riz" data-prot="7.0" data-lys="220" data-met="180" data-cal="360">Riz cru</option>
          <option value="quinoa" data-prot="14.0" data-lys="600" data-met="300" data-cal="368">Quinoa cru (Complet)</option>
          <option value="pates" data-prot="12.5" data-lys="300" data-met="190" data-cal="350">Pâtes crues</option>
          <option value="avoine" data-prot="13.5" data-lys="500" data-met="230" data-cal="389">Flocons d'avoine</option>
        </select>
      </div>

      <!-- Légumineuses & Soja -->
      <div class="select-group">
        <label for="legumineuse">Légumineuses / Soja :</label>
        <select id="legumineuse">
          <option value="">-- Aucune --</option>
          <option value="lentilles" data-prot="25.0" data-lys="1700" data-met="220" data-cal="350">Lentilles sèches</option>
          <option value="pois_chiches" data-prot="19.0" data-lys="1300" data-met="250" data-cal="364">Pois chiches secs</option>
          <option value="tofu" data-prot="12.0" data-lys="800" data-met="180" data-cal="144">Tofu frais (Complet)</option>
        </select>
      </div>
    </div>

    <div class="grid-select">
      <!-- Produits Laitiers & Œufs -->
      <div class="select-group">
        <label for="laitier">Produits Laitiers / Œufs :</label>
        <select id="laitier">
          <option value="">-- Aucun --</option>
          <option value="skyr" data-prot="10.0" data-lys="800" data-met="270" data-cal="57" data-b12="0.3">Skyr / Fromage blanc 0%</option>
          <option value="yaourt_grec" data-prot="6.0" data-lys="480" data-met="160" data-cal="120" data-b12="0.3">Yaourt grec</option>
          <option value="oeuf" data-prot="13.0" data-lys="900" data-met="390" data-cal="155" data-b12="1.1">Œuf entier</option>
          <option value="lait_vache" data-prot="3.3" data-lys="260" data-met="85" data-cal="62" data-b12="0.4">Lait de vache</option>
        </select>
      </div>

      <!-- Légumes -->
      <div class="select-group">
        <label for="legume">Légumes d'accompagnement :</label>
        <select id="legume">
          <option value="">-- Aucun --</option>
          <option value="brocoli" data-prot="2.8" data-lys="160" data-met="50" data-cal="34">Brocoli</option>
          <option value="epinard" data-prot="2.9" data-lys="170" data-met="55" data-cal="23">Épinards</option>
          <option value="legumes_mix" data-prot="1.5" data-lys="80" data-met="25" data-cal="30">Légumes variés</option>
        </select>
      </div>
    </div>

    <button type="button" id="btn-submit">Calculer les portions et l'équilibre</button>
  </form>

  <!-- Résultat (Design Précédent) -->
  <div id="result" class="result-card">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-value" id="total-protein">0g</span>
        <span class="stat-unit">Protéines Assimilables</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="quality-score">0%</span>
        <span class="stat-unit">Valeur Biologique (vs Viande)</span>
      </div>
      <div class="stat-box stat-full">
        <span class="stat-value" id="total-calories">0 kcal</span>
        <span class="stat-unit">Énergie Totale du Repas</span>
      </div>
    </div>

    <p id="portion-advice-text" class="status-msg"></p>
    <p id="b12-status-text" class="status-msg"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
